[package]
name = "csonpath"
version = "0.18.0"
edition = "2021"
description = "Partial JSONPath implementation in C with Rust bindings"
license = "BSD-3-Clause"
repository = "https://github.com/Outscale/csonpath"
homepage = "https://github.com/Outscale/csonpath"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
serde_json = "1.0"
