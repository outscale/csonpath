name: tests
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  auto-build:
    environment: auto-build
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        submodules: recursive
    - name: ⬇️ Install Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.x'
    - name: install     dependencies
      run: |
        sudo apt-get update --fix-missing
        sudo apt-get install -y -f -o Acquire::Retries=3 libjson-c-dev cmake pkg-config
    - name: Build and install yyjson
      run: |
        git clone --depth 1 https://github.com/ibireme/yyjson.git /tmp/yyjson
        cmake -S /tmp/yyjson -B /tmp/yyjson/build -DCMAKE_BUILD_TYPE=Release
        cmake --build /tmp/yyjson/build --parallel
        sudo cmake --install /tmp/yyjson/build
        sudo ldconfig
    - name: Build and test json-c/yyjson
      run: |
        ./configure --asan
        make
        make tests-c
    - name: build and test python
      run: |
        make tests-py

  build-windows:
    environment: auto-build
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        submodules: recursive
    - name: ⬇️ Install Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.x'
    - name: Install MinGW
      run: |
        choco install mingw -y
        echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH
    - name: install     dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install pytest
    - name: build python
      run: |
        python -m pip install --no-build-isolation -e .
    - name: test python
      run: |
        pytest tests/python
