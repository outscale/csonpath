name: bench baseline
on:
  push:
    branches: [ bench-baseline ]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.x'
    - name: install dependencies
      run: |
        sudo apt-get update --fix-missing
        sudo apt-get install -y -f -o Acquire::Retries=3 libjson-c-dev pkg-config miller
    - name: install python dependencies
      run: python -m pip install -e . jsonpath-ng
    - name: build benchmarks
      run: |
        make -C bench bench-json-c-gcc
        cargo build --release --manifest-path bench/Cargo.toml
        cargo build --release --manifest-path rust/Cargo.toml --bin bench
    - name: generate baseline
      run: |
        ./bench/collect
        ./bench/make-baseline
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: bench-baseline
        path: |
          bench/baseline.csv
          bench/baseline.meta
        if-no-files-found: error
